name: CI

on:
  push:
  pull_request:

jobs:
  lean:
    name: Lean gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The strict design-decision scan diffs against HEAD~1 on push
          # events; the default depth-1 checkout cannot resolve that base.
          fetch-depth: 2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
          curl https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Run repository gate
        shell: pwsh
        run: ./scripts/gate.ps1

      - name: Run strict claim-drift scan
        if: always()
        shell: pwsh
        run: ./scripts/claim_drift_scan.ps1 -Strict

      - name: Run strict design-decision scan
        if: always()
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin "${{ github.base_ref }}" --depth=1
            ./scripts/design_decision_check.ps1 -Base "origin/${{ github.base_ref }}" -Strict
          } else {
            ./scripts/design_decision_check.ps1 -Base "HEAD~1" -Strict
          }

  owned-process-windows:
    # The repository gate's process-ownership layer has two implementations --
    # a POSIX setsid process group and a Windows kill-on-close job -- and only
    # the POSIX one was ever exercised by CI, because every job here runs
    # ubuntu.  The Windows path shipped to `audit-v1-rc-2` without a
    # descendant-death barrier: it closed the job and waited on the root alone,
    # so a grandchild could still be alive when a caller asserted the tree was
    # dead.  The 2026-08-12 fresh-blind audit hit exactly that on the required
    # Windows gate path.
    #
    # This job is deliberately small: it runs only the ownership self-tests, so
    # it needs no Lean build and costs a minute, while covering the code path
    # that a green ubuntu run says nothing about.  `-AllowInconclusive` must
    # never be passed here; an inconclusive barrier run exits nonzero on
    # purpose.
    name: Owned-process ownership (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Owned-process self-test (Windows job ownership + descendant barrier)
        shell: pwsh
        run: ./scripts/owned_process_tree.ps1 -SelfTest

  owned-process-posix:
    # The POSIX twin of the job above, run standalone for the same reason: the
    # aggregate gate reaches these assertions only after a full Lean build, so a
    # regression in either ownership implementation should be visible in a
    # minute rather than behind twenty.
    name: Owned-process ownership (POSIX)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Owned-process self-test (setsid group + descendant barrier)
        shell: pwsh
        run: ./scripts/owned_process_tree.ps1 -SelfTest
