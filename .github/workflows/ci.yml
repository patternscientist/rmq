name: CI

on:
  push:
  pull_request:

jobs:
  lean:
    name: Lean gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The strict design-decision scan diffs against HEAD~1 on push
          # events; the default depth-1 checkout cannot resolve that base.
          fetch-depth: 2
          # Annotated tags, explicitly. actions/checkout fetches with
          # --no-tags when fetch-depth > 0 and fetch-tags is unset, so
          # tag_annotation_check.ps1 found no annotated tags and failed
          # -- correctly, since 'nothing was checked' is not a pass. The
          # repair belongs here, not in the checker: its header says CI
          # must not pass -AllowNoTags.
          fetch-tags: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
          curl https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Run repository gate
        shell: pwsh
        run: ./scripts/gate.ps1

      - name: Run strict claim-drift scan
        if: always()
        shell: pwsh
        run: ./scripts/claim_drift_scan.ps1 -Strict

      - name: Run strict design-decision scan
        if: always()
        shell: pwsh
        run: |
          # PER-COMMIT, not aggregate. The repository states that every commit
          # carries its own design-log update; running the check once over a
          # whole range does not enforce that, because one commit's
          # DESIGN_DECISIONS.md satisfies the membership test for every
          # code-sensitive file in the range. WDD-20260816-043 records a commit
          # that breached the invariant and passed CI for exactly this reason.
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin "${{ github.base_ref }}" --depth=0
            $range = "origin/${{ github.base_ref }}..HEAD"
          } else {
            $range = "HEAD~1..HEAD"
          }
          $commits = @(git rev-list --reverse $range)
          if ($commits.Count -eq 0) {
            Write-Host "DESIGN-CHECK: no commits in $range; nothing to certify"
            exit 1
          }
          $bad = 0
          foreach ($c in $commits) {
            Write-Host "--- $c $(git log -1 --format=%s $c)"
            ./scripts/design_decision_check.ps1 -Base "$c~1" -Head $c -Strict
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          if ($bad -gt 0) {
            Write-Host "DESIGN-CHECK: $bad of $($commits.Count) commit(s) failed per-commit certification"
            exit 1
          }
          Write-Host "DESIGN-CHECK: all $($commits.Count) commit(s) certified individually"

  owned-process-windows:
    # The repository gate's process-ownership layer has two implementations --
    # a POSIX setsid process group and a Windows kill-on-close job -- and only
    # the POSIX one was ever exercised by CI, because every job here runs
    # ubuntu.  The Windows path shipped to `audit-v1-rc-2` without a
    # descendant-death barrier: it closed the job and waited on the root alone,
    # so a grandchild could still be alive when a caller asserted the tree was
    # dead.  The 2026-08-12 fresh-blind audit hit exactly that on the required
    # Windows gate path.
    #
    # This job is deliberately small: it runs only the ownership self-tests, so
    # it needs no Lean build and costs a minute, while covering the code path
    # that a green ubuntu run says nothing about.  `-AllowInconclusive` must
    # never be passed here; an inconclusive barrier run exits nonzero on
    # purpose.
    name: Owned-process ownership (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Owned-process self-test (Windows job ownership + descendant barrier)
        shell: pwsh
        run: ./scripts/owned_process_tree.ps1 -SelfTest

  owned-process-posix:
    # The POSIX twin of the job above, run standalone for the same reason: the
    # aggregate gate reaches these assertions only after a full Lean build, so a
    # regression in either ownership implementation should be visible in a
    # minute rather than behind twenty.
    name: Owned-process ownership (POSIX)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Owned-process self-test (setsid group + descendant barrier)
        shell: pwsh
        run: ./scripts/owned_process_tree.ps1 -SelfTest
