name: CI

on:
  push:
  pull_request:

jobs:
  lean:
    name: Lean gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The strict design-decision scan diffs against HEAD~1 on push
          # events; the default depth-1 checkout cannot resolve that base.
          fetch-depth: 2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Run repository gate
        shell: pwsh
        run: ./scripts/gate.ps1

      - name: Run strict claim-drift scan
        if: always()
        shell: pwsh
        run: ./scripts/claim_drift_scan.ps1 -Strict

      - name: Run strict design-decision scan
        if: always()
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch origin "${{ github.base_ref }}" --depth=1
            ./scripts/design_decision_check.ps1 -Base "origin/${{ github.base_ref }}" -Strict
          } else {
            ./scripts/design_decision_check.ps1 -Base "HEAD~1" -Strict
          }
