name: Artifact Reproducibility

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

jobs:
  reproduce:
    name: Reproduce artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run artifact reproduction script
        shell: bash
        run: |
          set -o pipefail
          scripts/reproduce_artifact.sh 2>&1 | tee artifact-reproduction.log

      - name: Upload reproduction log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-reproduction-log
          path: artifact-reproduction.log
