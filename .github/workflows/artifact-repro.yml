name: Artifact Reproducibility

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

jobs:
  reproduce:
    name: Reproduce artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
          curl https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run artifact reproduction script
        shell: bash
        # The log is written outside the working tree: the gate's M1 replay
        # requires a clean baseline, and an untracked log file fails it.
        run: |
          set -o pipefail
          scripts/reproduce_artifact.sh 2>&1 | tee "$RUNNER_TEMP/artifact-reproduction.log"

      - name: Upload reproduction log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifact-reproduction-log
          path: ${{ runner.temp }}/artifact-reproduction.log

      - name: Create audit packet
        if: always()
        shell: pwsh
        run: ./scripts/make_audit_packet.ps1 -OutDir audit-packet

      - name: Upload audit packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-packet
          path: audit-packet
