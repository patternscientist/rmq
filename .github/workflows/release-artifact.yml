name: Release Artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and attach artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version
          curl https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run artifact reproduction script
        shell: bash
        run: |
          set -o pipefail
          scripts/reproduce_artifact.sh 2>&1 | tee artifact-reproduction.log

      - name: Prepare release attachments
        shell: bash
        run: |
          mkdir -p release-artifacts
          tar \
            --exclude=.git \
            --exclude=.lake \
            --exclude=release-artifacts \
            -czf "release-artifacts/rmq-source-${GITHUB_REF_NAME}.tar.gz" .
          cp artifact-reproduction.log release-artifacts/
          cp docs/ARTIFACT_REPRODUCIBILITY.md release-artifacts/
          cp docs/PAPER_MAIN_THEOREM.md release-artifacts/
          cp docs/PAPER_THEOREM_MAP.md release-artifacts/
          cp scripts/headline_axiom_check.lean release-artifacts/
          cp scripts/wordram_axiom_check.lean release-artifacts/
          cp scripts/axiom_check.lean release-artifacts/

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-artifacts/* --clobber
          else
            gh release create "$tag" release-artifacts/* \
              --title "$tag" \
              --notes "RMQ paper artifact release. See ARTIFACT_REPRODUCIBILITY.md and artifact-reproduction.log."
          fi

      - name: Upload release attachment copy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: release-artifacts/
